[project]
name = "leadpilot"
version = "0.1.0"
description = "Autonomous SME sales agent with FastAPI, FastMCP, tool calling, evaluation harness, and CRM workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "fastmcp>=4.0,<5",
  "httpx>=0.28,<1",
  "openai>=1.100,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
